[project]
name = "glasshat-ingest"
version = "0.1.0"
description = "Glasshat ingestion: deck PDF parse + chunk + embed"
requires-python = ">=3.12"
dependencies = [
    "glasshat-shared",
    "glasshat-agents",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasshat"]

[tool.uv.sources]
glasshat-shared = { workspace = true }
glasshat-agents = { workspace = true }
