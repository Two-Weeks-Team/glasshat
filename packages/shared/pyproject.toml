[project]
name = "glasshat-shared"
version = "0.1.0"
description = "Glasshat shared contracts: config, ids, errors, enums, abstraction protocols"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=2.0",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
# Lazy-imported real backends — not installed in CI; only when using that backend.
vertex = ["google-genai>=0.3", "google-adk>=1.0"]
phoenix = [
    "arize-phoenix>=11",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-google-adk>=0.1",
]
# The deployed Arize-track runtime: AX tracing (OTLP -> otlp.arize.com) PLUS the
# Phoenix-MCP client used by the audit's learning loop (CONSULTANT_BACKEND /
# DATASET_WRITER_BACKEND = phoenix-mcp). `mcp` MUST ship in this closure or the
# live PhoenixMcpConsultant/Writer raise ModuleNotFoundError at import and the
# loop silently degrades to the deterministic prior (the JS `@arizeai/phoenix-mcp`
# server is fetched at runtime via npx; this Python `mcp` SDK speaks to it over
# stdio). `mcp`'s closure is openai/anthropic-free, so the deploy-closure leak
# gate (.github/workflows/ci.yml) stays green.
arize = [
    "arize-otel>=0.12",
    "openinference-instrumentation-google-adk>=0.1",
    "mcp>=1.27",
]
firestore = ["google-cloud-firestore>=2.16"]
gcs = ["google-cloud-storage>=2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasshat"]
