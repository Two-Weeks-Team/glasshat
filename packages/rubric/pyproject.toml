[project]
name = "glasshat-rubric"
version = "0.1.0"
description = "Glasshat rubric engine: SynthesizedRubric model, BMAD vocabulary, presets, validation"
requires-python = ">=3.12"
dependencies = [
    "glasshat-shared",
    "pydantic>=2.7",
    "PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasshat"]

[tool.uv.sources]
glasshat-shared = { workspace = true }
