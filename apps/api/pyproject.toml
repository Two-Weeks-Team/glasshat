[project]
name = "glasshat-api"
version = "0.1.0"
description = "Glasshat HTTP API (FastAPI) over the evaluation pipeline"
requires-python = ">=3.12"
dependencies = [
    "glasshat-pipeline",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasshat"]

[tool.uv.sources]
glasshat-pipeline = { workspace = true }
