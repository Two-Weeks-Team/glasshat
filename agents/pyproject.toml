[project]
name = "glasshat-agents"
version = "0.1.0"
description = "Glasshat evaluation engine stages (synthesizer, planner, hats, audit, scorer, report)"
requires-python = ">=3.12"
dependencies = [
    "glasshat-shared",
    "glasshat-rubric",
    "pydantic>=2.7",
    "PyYAML>=6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasshat"]

[tool.uv.sources]
glasshat-shared = { workspace = true }
glasshat-rubric = { workspace = true }
