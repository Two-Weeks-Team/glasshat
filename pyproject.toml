[project]
name = "glasshat"
version = "0.1.0"
description = "Glasshat — Arize-track rubric-aware evaluation engine (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "glasshat-shared",
    "glasshat-rubric",
    "glasshat-agents",
    "glasshat-ingest",
    "glasshat-code-grader",
    "glasshat-pipeline",
    "glasshat-api",
]

[project.optional-dependencies]
# Real backends, surfaced from glasshat-shared so the API image can opt in at
# build time (`uv sync --extra vertex --extra phoenix`). Omitted by default — CI
# and the mock demo build need none of these.
vertex = ["glasshat-shared[vertex]"]
phoenix = ["glasshat-shared[phoenix]"]
arize = ["glasshat-shared[arize]"]
firestore = ["glasshat-shared[firestore]"]
gcs = ["glasshat-shared[gcs]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "agents", "apps/api"]

[tool.uv.sources]
glasshat-shared = { workspace = true }
glasshat-rubric = { workspace = true }
glasshat-agents = { workspace = true }
glasshat-ingest = { workspace = true }
glasshat-code-grader = { workspace = true }
glasshat-pipeline = { workspace = true }
glasshat-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "hypothesis>=6",
    # The ADK runtime (AGENT_RUNTIME=adk) is exercised by the parity test, so CI
    # installs google-adk here. It also ships in the deployed image via the
    # `vertex` extra; this dev entry just makes the parity gate runnable in CI.
    # >=2.0 is required: the adk runtime uses the ADK 2.0 Workflow graph API.
    "google-adk>=2.0",
]
# NOTE on cloud tooling (Agent-Engine deploy driver + Arize AX datasets/experiments
# /evals): these are DELIBERATELY NOT a uv dependency-group. `google-cloud-aiplatform`
# (and `arize`/`arize-phoenix-evals`, which pull it transitively) pins google-adk<2,
# which is INCOMPATIBLE with the google-adk 2.0 the lean deploy image needs for the
# ADK 2.0 Workflow API. Under uv's single universal resolution, locking them would
# drag the DEPLOY CLOSURE's google-adk down from 2.0 and balloon it by ~55 packages
# — violating the lean-image invariant. They therefore live in a standalone pip
# requirements file (`deploy/requirements-cloud.txt`) that is NEVER in `uv.lock`,
# NEVER in the `--extra vertex --extra arize` closure, and NEVER in the Cloud Run
# image. The deploy/experiment drivers install it in an isolated ephemeral overlay:
#   uv run --no-project --with-requirements deploy/requirements-cloud.txt python …
# and the deployed *remote* agent declares ADK 2.0 in agent_engines.create(
# config={"requirements": [...]}) — a separate pip env on Agent Engine itself.

[tool.pytest.ini_options]
addopts = "-q -m 'not integration' --import-mode=importlib"
markers = [
    "integration: requires live external credentials (Vertex/Phoenix/Firestore/GCS); deselected by default",
]
testpaths = [
    "packages/shared/tests",
    "packages/rubric/tests",
    "agents/tests",
    "services/ingest/tests",
    "services/code-grader/tests",
    "services/pipeline-orchestrator/tests",
    "apps/api/tests",
]
# uv-managed CPython 3.12.13 does not process editable `.pth` files via `site`,
# so src layouts are put on the path explicitly (standard pytest pattern).
# Deployment is unaffected: Docker installs built wheels (namespace packages
# land in site-packages directly).
pythonpath = [
    "packages/shared/src",
    "packages/rubric/src",
    "agents/src",
    "services/ingest/src",
    "services/code-grader/src",
    "services/pipeline-orchestrator/src",
    "apps/api/src",
]

[tool.coverage.run]
source = ["glasshat"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Lint only first-party code; spikes/mockups/data are validated reference artifacts.
extend-exclude = ["spikes", "mockups", "data", "claudedocs", "docs", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
# Strict typing on source; test files are linted by ruff. Excluding tests avoids
# duplicate-basename module clashes across the many per-package tests/ dirs.
exclude = '(^|/)tests/'
mypy_path = "packages/shared/src:packages/rubric/src:agents/src:services/ingest/src:services/code-grader/src:services/pipeline-orchestrator/src:apps/api/src"

[[tool.mypy.overrides]]
# Third-party SDK boundaries. ``follow_imports = "skip"`` treats them as ``Any``
# even when installed (google-adk pulls opentelemetry + mcp into the dev env for
# the ADK parity test); without it, mypy would type-check those untyped/partly
# typed packages and flag our lazy SDK call sites. We intentionally keep the SDK
# edge dynamically typed.
module = [
    "rank_bm25.*",
    "google",
    "google.*",
    "phoenix.*",
    "arize",
    "arize.*",
    "openinference.*",
    "opentelemetry",
    "opentelemetry.*",
    "mcp",
    "mcp.*",
]
ignore_missing_imports = true
follow_imports = "skip"
