[project]
name = "glasshat"
version = "0.1.0"
description = "Glasshat — Arize-track rubric-aware evaluation engine (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "glasshat-shared",
    "glasshat-rubric",
    "glasshat-agents",
    "glasshat-ingest",
    "glasshat-code-grader",
    "glasshat-pipeline",
    "glasshat-api",
]

[project.optional-dependencies]
# Real backends, surfaced from glasshat-shared so the API image can opt in at
# build time (`uv sync --extra vertex --extra phoenix`). Omitted by default — CI
# and the mock demo build need none of these.
vertex = ["glasshat-shared[vertex]"]
phoenix = ["glasshat-shared[phoenix]"]
firestore = ["glasshat-shared[firestore]"]
gcs = ["glasshat-shared[gcs]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "agents", "apps/api"]

[tool.uv.sources]
glasshat-shared = { workspace = true }
glasshat-rubric = { workspace = true }
glasshat-agents = { workspace = true }
glasshat-ingest = { workspace = true }
glasshat-code-grader = { workspace = true }
glasshat-pipeline = { workspace = true }
glasshat-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.pytest.ini_options]
addopts = "-q -m 'not integration' --import-mode=importlib"
markers = [
    "integration: requires live external credentials (Vertex/Phoenix/Firestore/GCS); deselected by default",
]
testpaths = [
    "packages/shared/tests",
    "packages/rubric/tests",
    "agents/tests",
    "services/ingest/tests",
    "services/code-grader/tests",
    "services/pipeline-orchestrator/tests",
    "apps/api/tests",
]
# uv-managed CPython 3.12.13 does not process editable `.pth` files via `site`,
# so src layouts are put on the path explicitly (standard pytest pattern).
# Deployment is unaffected: Docker installs built wheels (namespace packages
# land in site-packages directly).
pythonpath = [
    "packages/shared/src",
    "packages/rubric/src",
    "agents/src",
    "services/ingest/src",
    "services/code-grader/src",
    "services/pipeline-orchestrator/src",
    "apps/api/src",
]

[tool.coverage.run]
source = ["glasshat"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Lint only first-party code; spikes/mockups/data are validated reference artifacts.
extend-exclude = ["spikes", "mockups", "data", "claudedocs", "docs", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
# Strict typing on source; test files are linted by ruff. Excluding tests avoids
# duplicate-basename module clashes across the many per-package tests/ dirs.
exclude = '(^|/)tests/'
mypy_path = "packages/shared/src:packages/rubric/src:agents/src:services/ingest/src:services/code-grader/src:services/pipeline-orchestrator/src:apps/api/src"

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "google",
    "google.*",
    "phoenix.*",
    "openinference.*",
    "opentelemetry.*",
    "mcp",
    "mcp.*",
]
ignore_missing_imports = true
