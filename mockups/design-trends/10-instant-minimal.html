<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>glasshat · instant evaluation</title>
<style>
  :root {
    --bg: #fafafa;
    --ink: #0a0a0a;
    --ink-2: #525252;
    --ink-3: #a3a3a3;
    --line: #e7e7e7;
    --card: #ffffff;
    --accent: #2563ff;
    --accent-soft: #eef2ff;
    --good: #16a34a;
    --warn: #d97706;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --t-fast: 140ms cubic-bezier(.22,.61,.36,1);
    --t-med: 220ms cubic-bezier(.22,.61,.36,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px;
    line-height: 1.45;
  }
  .wrap {
    width: 100%;
    max-width: 940px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* header — near zero chrome */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 2px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.02em; }
  .dot {
    width: 18px; height: 18px; border-radius: 5px;
    background: var(--ink);
    position: relative;
  }
  .dot::after {
    content: ""; position: absolute; inset: 5px 5px auto auto;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .meta { font-size: 12px; color: var(--ink-3); display: flex; gap: 14px; }
  .meta b { color: var(--ink-2); font-weight: 550; }

  /* input zone */
  .input-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    transition: opacity var(--t-med), transform var(--t-med);
  }
  .input-card.gone { opacity: 0; transform: translateY(-6px); pointer-events: none; height: 0; padding: 0; border: 0; overflow: hidden; margin: 0; }
  textarea {
    width: 100%; border: 0; resize: none; outline: none;
    font: inherit; font-size: 14px; color: var(--ink);
    background: transparent; min-height: 92px;
  }
  textarea::placeholder { color: var(--ink-3); }
  .input-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .hint { font-size: 12px; color: var(--ink-3); }
  .go {
    border: 0; background: var(--ink); color: #fff;
    font: inherit; font-weight: 600; font-size: 13px;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform var(--t-fast), background var(--t-fast);
  }
  .go:hover { transform: translateY(-1px); }
  .go:active { transform: translateY(0) scale(.98); }
  .go svg { width: 14px; height: 14px; }

  /* pipeline rail */
  .pipeline {
    display: flex; align-items: center; gap: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 14px;
    overflow-x: auto;
  }
  .stage {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink-3);
    white-space: nowrap;
    transition: color var(--t-fast);
  }
  .stage .pip {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line);
    display: grid; place-items: center;
    transition: border-color var(--t-fast), background var(--t-fast);
    flex: 0 0 auto;
  }
  .stage .pip svg { width: 9px; height: 9px; opacity: 0; transition: opacity var(--t-fast); }
  .stage.active { color: var(--ink); font-weight: 600; }
  .stage.active .pip { border-color: var(--accent); background: var(--accent); }
  .stage.active .pip::after {
    content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--accent); animation: ping 1s ease-out infinite;
  }
  .stage.done { color: var(--ink-2); }
  .stage.done .pip { border-color: var(--good); background: var(--good); }
  .stage.done .pip svg { opacity: 1; }
  .connector { flex: 1 1 auto; height: 2px; min-width: 16px; background: var(--line); margin: 0 10px; position: relative; overflow: hidden; border-radius: 2px; }
  .connector::after {
    content: ""; position: absolute; inset: 0; width: 0; background: var(--accent);
    transition: width var(--t-med);
  }
  .connector.fill::after { width: 100%; }
  @keyframes ping { from { transform: scale(1); opacity: .5; } to { transform: scale(2.1); opacity: 0; } }

  /* results grid */
  .stage-pip-wrap { position: relative; display: grid; place-items: center; }

  .panel {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 14px;
    opacity: 0; transform: translateY(8px);
    transition: opacity var(--t-med), transform var(--t-med);
  }
  .panel.show { opacity: 1; transform: none; }
  @media (max-width: 720px) { .panel { grid-template-columns: 1fr; } }

  .hats {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 6px;
  }
  .hat {
    display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 11px;
    padding: 10px 11px; border-radius: 10px; cursor: pointer;
    transition: background var(--t-fast);
  }
  .hat:hover { background: #f5f5f5; }
  .hat .chip {
    width: 22px; height: 22px; border-radius: 7px; flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .hat .label { font-size: 13px; font-weight: 550; }
  .hat .sub { font-size: 11px; color: var(--ink-3); }
  .hat .score {
    font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
    display: flex; align-items: baseline; gap: 2px;
    transition: color var(--t-fast);
  }
  .hat .score .max { font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .hat .skeleton {
    width: 40px; height: 14px; border-radius: 5px;
    background: linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);
    background-size: 400% 100%; animation: shimmer 1.1s ease infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* evidence drawer per hat */
  .hat-wrap { border-bottom: 1px solid transparent; }
  .hat-wrap:not(:last-child) { border-bottom: 1px solid var(--line); }
  .evidence {
    max-height: 0; overflow: hidden;
    transition: max-height var(--t-med);
    padding: 0 11px;
  }
  .evidence.open { max-height: 230px; }
  .ev-inner { padding: 4px 0 13px; display: flex; flex-direction: column; gap: 7px; }
  .ev-line {
    font-size: 12px; color: var(--ink-2); line-height: 1.5;
    padding-left: 11px; border-left: 2px solid var(--accent);
  }
  .ev-line b { color: var(--ink); font-weight: 600; }
  .ev-src {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--accent); font-weight: 600;
    background: var(--accent-soft); padding: 3px 8px; border-radius: 6px;
    align-self: flex-start; cursor: pointer;
  }
  .ev-src::before { content: "↳"; }

  /* right column */
  .side { display: flex; flex-direction: column; gap: 14px; }
  .audit, .final {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 15px;
  }
  .card-h { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 11px; display: flex; align-items: center; gap: 7px; }
  .card-h .live { width: 6px; height: 6px; border-radius: 50%; background: var(--good); animation: blink 1.4s ease infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .audit-row { font-size: 13px; color: var(--ink-2); display: flex; align-items: flex-start; gap: 9px; opacity: 0; transform: translateY(4px); transition: opacity var(--t-fast), transform var(--t-fast); margin-bottom: 9px; }
  .audit-row.in { opacity: 1; transform: none; }
  .audit-row .tick { color: var(--good); font-weight: 700; flex: 0 0 auto; }
  .audit-row.flag .tick { color: var(--warn); }
  .audit-row b { color: var(--ink); font-weight: 600; }
  .flip {
    font-variant-numeric: tabular-nums; font-weight: 700;
    display: inline-grid; grid-template-columns: 1fr; align-items: center;
  }
  .flip .old { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .flip .new { color: var(--warn); }
  .flip .arrow { color: var(--ink-3); margin: 0 5px; }

  .final { text-align: center; padding: 20px 15px; }
  .final-score {
    font-size: 56px; font-weight: 750; letter-spacing: -.03em; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--ink);
    display: inline-flex; align-items: baseline;
  }
  .final-score .fmax { font-size: 20px; color: var(--ink-3); font-weight: 600; margin-left: 3px; }
  .scale-note { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  .bar { display: flex; gap: 3px; margin-top: 15px; height: 7px; }
  .bar span { flex: 1; border-radius: 3px; background: var(--line); transform: scaleY(0); transform-origin: bottom; transition: transform var(--t-fast), background var(--t-fast); }
  .bar span.on { transform: scaleY(1); background: var(--accent); }
  .breakdown { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .bd-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
  .bd-row .v { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bd-track { flex: 1; height: 4px; background: var(--line); border-radius: 2px; margin: 0 10px; overflow: hidden; }
  .bd-track i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 2px; transition: width var(--t-med); }

  footer { text-align: center; font-size: 11px; color: var(--ink-3); padding: 4px 0 8px; }
  .replay { background: none; border: 1px solid var(--line); color: var(--ink-2); font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: background var(--t-fast); }
  .replay:hover { background: #f0f0f0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><span class="dot"></span> glasshat</div>
    <div class="meta">
      <span>model <b>gemini-3.1-flash-lite</b></span>
      <span>obs <b>Arize AX</b></span>
    </div>
  </header>

  <!-- INPUT -->
  <div class="input-card" id="inputCard">
    <textarea id="pitch" spellcheck="false">PantryPilot — we cut household food waste 40%. Our app scans grocery receipts, predicts spoilage with on-device ML, and auto-generates recipes from what's about to expire. 1,200 weekly actives in beta, 31% week-4 retention, $0 CAC via a recipe-sharing loop. Asking for the rubric to evaluate technical depth, market, and demo readiness.</textarea>
    <div class="input-foot">
      <span class="hint">Evaluated live against the official rubric by a 6-perspective panel.</span>
      <button class="go" id="goBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Evaluate
      </button>
    </div>
  </div>

  <!-- PIPELINE -->
  <div class="pipeline" id="pipeline">
    <div class="stage" data-s="0"><span class="stage-pip-wrap"><span class="pip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></span> Input</div>
    <div class="connector"></div>
    <div class="stage" data-s="1"><span class="stage-pip-wrap"><span class="pip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></span> RubricSynthesizer</div>
    <div class="connector"></div>
    <div class="stage" data-s="2"><span class="stage-pip-wrap"><span class="pip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></span> BluePlanner</div>
    <div class="connector"></div>
    <div class="stage" data-s="3"><span class="stage-pip-wrap"><span class="pip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></span> SixHatPanel</div>
    <div class="connector"></div>
    <div class="stage" data-s="4"><span class="stage-pip-wrap"><span class="pip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></span> Audit</div>
    <div class="connector"></div>
    <div class="stage" data-s="5"><span class="stage-pip-wrap"><span class="pip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></span> Final</div>
  </div>

  <!-- RESULTS -->
  <div class="panel" id="panel">
    <div class="hats" id="hats"></div>

    <div class="side">
      <div class="audit">
        <div class="card-h"><span class="live"></span> Self-audit</div>
        <div id="auditLog"></div>
      </div>
      <div class="final">
        <div class="card-h" style="justify-content:center">Final score</div>
        <div class="final-score"><span id="finalNum">—</span><span class="fmax">/ 50</span></div>
        <div class="scale-note">rubric native scale · 5 criteria × 10</div>
        <div class="bar" id="bar"></div>
        <div class="breakdown" id="breakdown"></div>
      </div>
    </div>
  </div>

  <footer>
    Calibrated via Phoenix MCP · <button class="replay" id="replay">Replay evaluation</button>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var S = function(ms){ return reduce ? 0 : ms; };

  // ----- data: six hats, grounded evidence, audit -----
  var HATS = [
    { id:"white", color:"#e5e5e5", label:"White · Facts", sub:"data & claims", score:7.6,
      ev:[ {t:"<b>1,200 weekly actives</b> + 31% week-4 retention are concrete, dated metrics.", src:"pitch ¶1 · metrics block"},
           {t:"On-device ML claim lacks a model card or accuracy figure.", src:"rubric: Technical Depth 2.3"} ] },
    { id:"red", color:"#fca5a5", label:"Red · Instinct", sub:"gut reaction", score:6.9,
      ev:[ {t:"\"40% waste cut\" reads as a headline promise without a measurement window.", src:"pitch ¶1 · opening"},
           {t:"Recipe-sharing loop feels genuinely shareable — low-friction emotion.", src:"rubric: Market Pull 4.1"} ] },
    { id:"yellow", color:"#fde047", label:"Yellow · Upside", sub:"best case", score:7.8, raw:9.0,
      ev:[ {t:"$0 CAC via organic loop is a strong unit-economics signal <i>if</i> it holds at scale.", src:"pitch ¶1 · growth"},
           {t:"Initial 9.0 assumed CAC stays $0 at 100× volume — unsupported extrapolation.", src:"audit: confidence flag"} ] },
    { id:"black", color:"#404040", label:"Black · Risk", sub:"caution", score:7.1,
      ev:[ {t:"Receipt OCR + spoilage prediction is a hard accuracy problem; no eval shown.", src:"rubric: Technical Depth 2.3"},
           {t:"31% week-4 retention is decent but unproven past 4 weeks.", src:"pitch ¶1 · retention"} ] },
    { id:"green", color:"#86efac", label:"Green · Ideas", sub:"alternatives", score:8.0,
      ev:[ {t:"Expiry data could power a B2B grocer-demand signal — adjacent revenue.", src:"rubric: Market 3.0"},
           {t:"On-device ML enables a privacy-first wedge vs cloud competitors.", src:"pitch ¶1 · ML"} ] },
    { id:"blue", color:"#93c5fd", label:"Blue · Process", sub:"meta-control", score:7.7,
      ev:[ {t:"Asks explicitly for technical / market / demo evaluation — well-scoped.", src:"pitch ¶1 · ask"},
           {t:"Demo-readiness evidence (live build, video) not yet attached.", src:"rubric: Demo 5.2"} ] }
  ];

  // 5 rubric criteria mapped from hat consensus → /50
  var CRITERIA = [
    { name:"Technical depth", v:7.2 },
    { name:"Market & traction", v:7.9 },
    { name:"Demo readiness", v:6.8 },
    { name:"Clarity of ask", v:8.1 },
    { name:"Defensibility", v:7.4 }
  ];

  var hatsEl = document.getElementById("hats");
  var stages = Array.prototype.slice.call(document.querySelectorAll(".stage"));
  var conns = Array.prototype.slice.call(document.querySelectorAll(".connector"));

  // build hat rows (skeleton state)
  function buildHats(){
    hatsEl.innerHTML = "";
    HATS.forEach(function(h, i){
      var wrap = document.createElement("div");
      wrap.className = "hat-wrap";
      wrap.innerHTML =
        '<div class="hat" data-i="'+i+'">'+
          '<span class="chip" style="background:'+h.color+'"></span>'+
          '<span><div class="label">'+h.label+'</div><div class="sub">'+h.sub+'</div></span>'+
          '<span class="score" id="sc'+i+'"><span class="skeleton"></span></span>'+
        '</div>'+
        '<div class="evidence" id="ev'+i+'"><div class="ev-inner">'+
          h.ev.map(function(e){ return '<div class="ev-line">'+e.t+'<br><span class="ev-src">'+e.src+'</span></div>'; }).join("")+
        '</div></div>';
      hatsEl.appendChild(wrap);
    });
    // toggle evidence
    hatsEl.querySelectorAll(".hat").forEach(function(row){
      row.addEventListener("click", function(){
        var i = row.getAttribute("data-i");
        var ev = document.getElementById("ev"+i);
        var wasOpen = ev.classList.contains("open");
        hatsEl.querySelectorAll(".evidence").forEach(function(e){ e.classList.remove("open"); });
        if(!wasOpen) ev.classList.add("open");
      });
    });
  }

  function fillScore(i){
    var h = HATS[i];
    var el = document.getElementById("sc"+i);
    // yellow shows its raw (over-confident) score first; audit corrects later
    var shown = (h.raw != null) ? h.raw : h.score;
    el.innerHTML = '<span id="num'+i+'">'+shown.toFixed(1)+'</span><span class="max">/10</span>';
  }

  var auditLog = document.getElementById("auditLog");
  function auditRow(html, flag){
    var d = document.createElement("div");
    d.className = "audit-row" + (flag ? " flag" : "");
    d.innerHTML = '<span class="tick">'+(flag?"!":"✓")+'</span><span>'+html+'</span>';
    auditLog.appendChild(d);
    requestAnimationFrame(function(){ setTimeout(function(){ d.classList.add("in"); }, 10); });
    return d;
  }

  // crisp number flip for the over-confident hat
  function flipYellow(cb){
    var idx = HATS.findIndex(function(h){ return h.id === "yellow"; });
    var numEl = document.getElementById("num"+idx);
    var scEl = document.getElementById("sc"+idx);
    var raw = HATS[idx].raw, corrected = HATS[idx].score;
    var row = auditRow('<b>YELLOW</b> over-confident: assumed $0 CAC at scale. Pulling back <span class="flip"><span class="old">'+raw.toFixed(1)+'</span><span class="arrow">→</span><span class="new" id="flipNew">'+raw.toFixed(1)+'</span></span>', true);
    var flipNew = function(){ return document.getElementById("flipNew"); };
    setTimeout(function(){
      // animate count-down on both the hat score and the audit-line number
      var steps = 12, i = 0;
      var from = raw, to = corrected;
      var iv = setInterval(function(){
        i++;
        var val = (from + (to - from) * (i/steps));
        numEl.textContent = val.toFixed(1);
        var fn = flipNew(); if(fn) fn.textContent = val.toFixed(1);
        if(i >= steps){
          clearInterval(iv);
          numEl.textContent = to.toFixed(1);
          var fn2 = flipNew(); if(fn2) fn2.textContent = to.toFixed(1);
          scEl.querySelector(".score, #num"+idx);
          numEl.style.color = "var(--warn)";
          if(cb) cb();
        }
      }, S(34) || 1);
      if(reduce){ numEl.textContent = to.toFixed(1); var fn = flipNew(); if(fn) fn.textContent = to.toFixed(1); numEl.style.color="var(--warn)"; if(cb) cb(); }
    }, S(420));
  }

  function renderFinal(){
    // sum corrected criteria → /50
    var total = CRITERIA.reduce(function(a,c){ return a + c.v; }, 0);
    var bar = document.getElementById("bar");
    bar.innerHTML = "";
    var seg = 25;
    for(var k=0;k<seg;k++){ var s=document.createElement("span"); bar.appendChild(s); }
    var lit = Math.round((total/50)*seg);
    var bd = document.getElementById("breakdown");
    bd.innerHTML = CRITERIA.map(function(c){
      return '<div class="bd-row"><span>'+c.name+'</span><span class="bd-track"><i data-w="'+(c.v*10)+'"></i></span><span class="v">'+c.v.toFixed(1)+'</span></div>';
    }).join("");

    // animate count up
    var numEl = document.getElementById("finalNum");
    var steps = 18, i = 0;
    var iv = setInterval(function(){
      i++;
      numEl.textContent = (total * (i/steps)).toFixed(1);
      if(i>=steps){ clearInterval(iv); numEl.textContent = total.toFixed(1); }
    }, S(28) || 1);
    if(reduce) numEl.textContent = total.toFixed(1);

    // light up bar + tracks
    var segs = bar.children;
    for(var b=0;b<lit;b++){ (function(b){ setTimeout(function(){ segs[b].classList.add("on"); }, S(b*18)); })(b); }
    Array.prototype.forEach.call(bd.querySelectorAll("i"), function(el){
      setTimeout(function(){ el.style.width = el.getAttribute("data-w")+"%"; }, S(120));
    });
  }

  // ----- orchestration -----
  function setStage(i, state){
    var st = stages[i];
    st.classList.remove("active","done");
    st.classList.add(state);
    if(state === "done" && conns[i]) conns[i].classList.add("fill");
  }

  function run(){
    // reset
    stages.forEach(function(s){ s.classList.remove("active","done"); });
    conns.forEach(function(c){ c.classList.remove("fill"); });
    auditLog.innerHTML = "";
    document.getElementById("finalNum").textContent = "—";
    document.getElementById("bar").innerHTML = "";
    document.getElementById("breakdown").innerHTML = "";
    buildHats();
    document.getElementById("panel").classList.add("show");
    document.getElementById("inputCard").classList.add("gone");

    var q = [];
    var push = function(delay, fn){ q.push({d:delay, fn:fn}); };

    push(0,   function(){ setStage(0,"active"); });
    push(260, function(){ setStage(0,"done"); setStage(1,"active"); });
    push(520, function(){ setStage(1,"done"); setStage(2,"active");
                          auditRow('Rubric synthesized: <b>5 criteria</b> from official sheet.'); });
    push(780, function(){ setStage(2,"done"); setStage(3,"active");
                          auditRow('Blue plan: route to <b>6-hat panel</b>, evidence-grounded.'); });
    // SixHatPanel — fill each hat score quickly, staggered
    HATS.forEach(function(h, i){
      push(940 + i*150, function(){ fillScore(i); });
    });
    push(940 + HATS.length*150 + 120, function(){ setStage(3,"done"); setStage(4,"active");
      auditRow('Cross-checking <b>6 scores</b> against retrieved evidence…'); });
    // AUDIT: catch over-confident yellow + flip
    push(940 + HATS.length*150 + 360, function(){
      flipYellow(function(){
        auditRow('Re-grounded. Panel variance within tolerance. <b>Audit passed.</b>');
        setTimeout(function(){
          setStage(4,"done"); setStage(5,"active");
          setTimeout(function(){ setStage(5,"done"); renderFinal(); }, S(220));
        }, S(260));
      });
    });

    // execute queue
    var base = 0;
    q.forEach(function(item){
      setTimeout(item.fn, S(item.d));
    });
  }

  document.getElementById("goBtn").addEventListener("click", run);
  document.getElementById("replay").addEventListener("click", function(){
    document.getElementById("inputCard").classList.remove("gone");
    document.getElementById("panel").classList.remove("show");
    setTimeout(run, S(120) || 30);
  });

  // auto-skeleton on load so the layout is felt instantly
  buildHats();
})();
</script>
</body>
</html>
